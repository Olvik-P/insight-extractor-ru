[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-extractor-ru"
version = "0.1.0"
description = "Pipeline for analyzing anonymized B2B call transcripts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
insight-extractor-ru = "insight_extractor_ru.cli.main:main"

[tool.setuptools.packages.find]
include = ["insight_extractor_ru*"]

[tool.pytest.ini_options]
testpaths = ["insight_extractor_ru/tests"]

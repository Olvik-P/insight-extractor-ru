[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-extractor-ru"
version = "0.1.0"
description = "Pipeline for analyzing anonymized B2B call transcripts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "pre-commit>=4.0",
]

[project.scripts]
insight-extractor-ru = "insight_extractor_ru.cli.main:main"

[tool.setuptools.packages.find]
include = ["insight_extractor_ru*"]

[tool.pytest.ini_options]
testpaths = ["insight_extractor_ru/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["insight_extractor_ru.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["insight_extractor_ru"]
